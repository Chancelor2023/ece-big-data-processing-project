name: ${COMPOSE_PROJECT_NAME:-imdb-big-data}

services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: imdb-big-data-spark:4.0.1
    working_dir: /workspace
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Copy .env.example to .env and set JUPYTER_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      WIKIMEDIA_TOPIC: wikimedia.recentchange
      PROJECT_ROOT: /workspace
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-4}
      PYSPARK_SUBMIT_ARGS: --driver-memory ${SPARK_DRIVER_MEMORY:-2g} pyspark-shell
    volumes:
      - .:/workspace
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/bootstrap/check_jupyter.py"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 4g
    shm_size: 512m
    restart: unless-stopped

volumes:
  kafka-data:
